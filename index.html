<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Duck Drift</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #1a1a2e;
    }

    .control-btn {
      position: fixed;
      bottom: 0;
      width: 45%;
      height: 35%;
      min-height: 120px;
      border: none;
      font-size: 1.5rem;
      font-weight: bold;
      color: #fff;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }

    .control-btn.brake {
      left: 0;
      background: #e74c3c;
      border-radius: 24px 24px 0 0;
    }

    .control-btn.brake.active {
      background: #c0392b;
    }

    .control-btn.gas {
      right: 0;
      background: #2ecc71;
      border-radius: 24px 24px 0 0;
    }

    .control-btn.gas.active {
      background: #27ae60;
    }

    #enable-steering {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #3498db;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      touch-action: manipulation;
      cursor: pointer;
    }

    #steering-debug {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      padding: 8px 12px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.6);
      color: #0f0;
      font-family: monospace;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <button id="enable-steering">Steuerung aktivieren</button>
  <div id="steering-debug">steering: 0.00</div>
  <button class="control-btn brake" id="brake">Bremse</button>
  <button class="control-btn gas" id="gas">Gas</button>

  <script>
    const state = { brake: false, gas: false, steering: 0 };
    const MAX_TILT = 45;

    const enableBtn = document.getElementById('enable-steering');
    const debugEl = document.getElementById('steering-debug');
    let neutralBeta = null;

    function normalizeBeta(beta) {
      if (beta == null || neutralBeta == null) return 0;
      const tilt = beta - neutralBeta;
      return Math.max(-1, Math.min(1, tilt / MAX_TILT));
    }

    function handleOrientation(event) {
      if (neutralBeta === null && event.beta != null) {
        neutralBeta = event.beta;
      }
      state.steering = normalizeBeta(event.beta);
      debugEl.textContent = `steering: ${state.steering.toFixed(2)} (β: ${event.beta?.toFixed(1) ?? '–'})`;
    }

    async function enableSteering() {
      try {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission !== 'granted') {
            enableBtn.textContent = 'Berechtigung verweigert';
            return;
          }
        }
        neutralBeta = null;
        window.addEventListener('deviceorientation', handleOrientation, true);
        enableBtn.hidden = true;
      } catch (err) {
        enableBtn.textContent = 'Fehler – erneut versuchen';
      }
    }

    enableBtn.addEventListener('click', enableSteering);

    function bindControl(button, key) {
      function press(e) {
        e.preventDefault();
        state[key] = true;
        button.classList.add('active');
      }

      function release() {
        state[key] = false;
        button.classList.remove('active');
      }

      button.addEventListener('touchstart', press, { passive: false });
      button.addEventListener('touchend', release);
      button.addEventListener('touchcancel', release);

      button.addEventListener('pointerdown', press);
      button.addEventListener('pointerup', release);
      button.addEventListener('pointercancel', release);
      button.addEventListener('pointerleave', release);
    }

    bindControl(document.getElementById('brake'), 'brake');
    bindControl(document.getElementById('gas'), 'gas');
  </script>
</body>
</html>
