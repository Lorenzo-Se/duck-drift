<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Duck Drift – Controller</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #1a1a2e;
      color: #fff;
      font-family: system-ui, sans-serif;
    }

    #car-select-screen[hidden],
    #control-screen[hidden],
    #rotate-screen[hidden] {
      display: none !important;
    }

    #car-select-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 24px 0;
      box-sizing: border-box;
      touch-action: manipulation;
    }

    #car-select-screen h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }

    #car-select-hint {
      margin: 0 0 24px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
    }

    .carousel-wrap {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .carousel-arrow {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 1.25rem;
      cursor: pointer;
      touch-action: manipulation;
      z-index: 1;
    }

    .carousel-track {
      display: flex;
      flex: 1;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      gap: 16px;
      padding: 16px 25vw;
      scrollbar-width: none;
      touch-action: pan-x;
    }

    .carousel-track::-webkit-scrollbar {
      display: none;
    }

    .carousel-card {
      flex: 0 0 50vw;
      max-width: 200px;
      scroll-snap-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px 12px;
      border: 2px solid transparent;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.06);
      cursor: pointer;
      touch-action: manipulation;
      transition: border-color 0.15s, transform 0.15s;
    }

    .carousel-card:active {
      transform: scale(0.97);
    }

    .carousel-card canvas {
      display: block;
    }

    .carousel-card-label {
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
    }

    .control-btn {
      position: fixed;
      bottom: 0;
      width: 45%;
      height: 35%;
      min-height: 120px;
      border: none;
      font-size: 1.5rem;
      font-weight: bold;
      color: #fff;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }

    .control-btn.brake {
      left: 0;
      background: #e74c3c;
      border-radius: 24px 24px 0 0;
    }

    .control-btn.brake.active {
      background: #c0392b;
    }

    .control-btn.gas {
      right: 0;
      background: #2ecc71;
      border-radius: 24px 24px 0 0;
    }

    .control-btn.gas.active {
      background: #27ae60;
    }

    #rotate-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: #1a1a2e;
      touch-action: manipulation;
    }

    #rotate-content {
      text-align: center;
      max-width: 320px;
    }

    #rotate-icon {
      font-size: 4rem;
      margin-bottom: 24px;
      line-height: 1;
    }

    #rotate-title {
      margin: 0 0 12px;
      font-size: 1.35rem;
    }

    #rotate-error {
      margin: 0 0 16px;
      color: #e74c3c;
      font-size: 0.9rem;
    }

    #rotate-error[hidden],
    #rotate-hint[hidden] {
      display: none;
    }

    #rotate-hint {
      margin: 0 0 16px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.85rem;
      line-height: 1.4;
    }

    #rotate-start-btn {
      margin-top: 8px;
      padding: 16px 32px;
      border: none;
      border-radius: 8px;
      background: #3498db;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      touch-action: manipulation;
      cursor: pointer;
    }

    #rotate-start-btn[hidden] {
      display: none;
    }

    #game-start-flash {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(46, 204, 113, 0.85);
      font-size: 3rem;
      font-weight: bold;
      color: #fff;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease-out;
    }

    #game-start-flash.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="car-select-screen" hidden>
    <h1>Wähle dein Auto</h1>
    <p id="car-select-hint">Wische und tippe zum Auswählen</p>
    <div class="carousel-wrap">
      <button type="button" class="carousel-arrow" id="carousel-prev" aria-label="Vorheriges Auto">‹</button>
      <div class="carousel-track" id="carousel-track"></div>
      <button type="button" class="carousel-arrow" id="carousel-next" aria-label="Nächstes Auto">›</button>
    </div>
  </div>

  <div id="control-screen" hidden>
    <div id="rotate-screen">
      <div id="rotate-content">
        <div id="rotate-icon" aria-hidden="true">↺</div>
        <h2 id="rotate-title">Bitte Handy ins Querformat drehen</h2>
        <p id="rotate-hint" hidden></p>
        <p id="rotate-error" hidden aria-live="polite"></p>
        <button type="button" id="rotate-start-btn" hidden>Tippen zum Starten</button>
      </div>
    </div>
    <button class="control-btn brake" id="brake" hidden>Bremse</button>
    <button class="control-btn gas" id="gas" hidden>Gas</button>
  </div>
  <div id="game-start-flash" hidden aria-hidden="true">Los!</div>

  <script>
    const carSelectScreen = document.getElementById('car-select-screen');
    const carouselTrack = document.getElementById('carousel-track');
    const carouselPrev = document.getElementById('carousel-prev');
    const carouselNext = document.getElementById('carousel-next');
    const controlScreen = document.getElementById('control-screen');

    const CAR_PRESETS = [
      { id: 'red', color: '#ff3333', label: 'Roter Bolide' },
      { id: 'blue', color: '#3366ff', label: 'Blauer Blitz' },
      { id: 'green', color: '#33cc33', label: 'Grüner Racer' },
      { id: 'yellow', color: '#ffcc00', label: 'Gelber Flitzer' },
      { id: 'purple', color: '#aa44ff', label: 'Lila Turbo' },
      { id: 'orange', color: '#ff8833', label: 'Oranger Drift' },
    ];

    let ws = null;
    let joined = false;
    let carSelected = false;
    let playerId = null;
    let slot = null;
    let inputIntervalId = null;

    const state = { brake: false, gas: false, steering: 0 };

    const params = new URLSearchParams(location.search);
    const roomCode = params.get('room')?.trim() ?? '';
    const name = params.get('name')?.trim() ?? '';

    if (!/^\d{4}$/.test(roomCode) || !name) {
      location.replace('/');
      throw new Error('Missing join parameters');
    }

    function redirectWithError(message) {
      const url = new URL('/', location.origin);
      url.searchParams.set('error', message);
      if (/^\d{4}$/.test(roomCode)) {
        url.searchParams.set('room', roomCode);
      }
      location.replace(url.toString());
    }

    function drawCarPreview(canvas, color) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.save();
      ctx.translate(w / 2, h / 2);
      ctx.scale(3, 3);
      ctx.fillStyle = color;
      ctx.fillRect(-12, -6, 24, 12);
      ctx.fillStyle = '#ffcc00';
      ctx.fillRect(8, -4, 6, 8);
      ctx.restore();
    }

    function buildCarousel() {
      carouselTrack.innerHTML = '';
      for (const preset of CAR_PRESETS) {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'carousel-card';
        card.dataset.color = preset.color;

        const canvas = document.createElement('canvas');
        canvas.width = 120;
        canvas.height = 60;
        drawCarPreview(canvas, preset.color);

        const label = document.createElement('span');
        label.className = 'carousel-card-label';
        label.textContent = preset.label;

        card.appendChild(canvas);
        card.appendChild(label);
        card.addEventListener('click', () => selectCar(preset.color));
        carouselTrack.appendChild(card);
      }
    }

    function scrollCarousel(direction) {
      const card = carouselTrack.querySelector('.carousel-card');
      if (!card) return;
      const scrollAmount = card.offsetWidth + 16;
      carouselTrack.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
    }

    carouselPrev.addEventListener('click', () => scrollCarousel(-1));
    carouselNext.addEventListener('click', () => scrollCarousel(1));

    function showCarSelectScreen() {
      buildCarousel();
      carSelectScreen.hidden = false;
    }

    function selectCar(color) {
      if (carSelected || !joined || !ws || ws.readyState !== WebSocket.OPEN) return;
      carSelected = true;

      ws.send(JSON.stringify({ type: 'selectCar', target: 'host', color }));
      carSelectScreen.hidden = true;
      showControlScreen();
      startInputLoop();
    }

    function showControlScreen() {
      controlScreen.hidden = false;
      initControls();
      startLandscapeWatch();
    }

    function sendInput() {
      if (!joined || !ws || ws.readyState !== WebSocket.OPEN) return;

      ws.send(JSON.stringify({
        type: 'input',
        target: 'host',
        steering: Math.round(state.steering * 100) / 100,
        throttle: state.gas,
        brake: state.brake,
      }));
    }

    function stopInputLoop() {
      if (inputIntervalId !== null) {
        clearInterval(inputIntervalId);
        inputIntervalId = null;
      }
    }

    function startInputLoop() {
      if (!joined || !ws || ws.readyState !== WebSocket.OPEN || inputIntervalId !== null) return;
      inputIntervalId = setInterval(sendInput, 50);
    }

    function handleJoinFailure(message) {
      stopInputLoop();
      joined = false;
      if (ws) {
        ws.close();
        ws = null;
      }
      redirectWithError(message);
    }

    function connectAndJoin() {
      joined = false;

      const wsUrl = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'join', roomCode, name }));
      };

      ws.onmessage = (event) => {
        let msg;
        try {
          msg = JSON.parse(event.data);
        } catch {
          handleJoinFailure('Ungültige Server-Antwort.');
          return;
        }

        if (msg.type === 'joined') {
          joined = true;
          playerId = msg.playerId;
          slot = msg.slot;
          showCarSelectScreen();
        } else if (msg.type === 'broadcast' && msg.event === 'gameStart') {
          showGameStartFlash();
        } else if (msg.type === 'error') {
          handleJoinFailure(msg.message || 'Beitritt fehlgeschlagen.');
        }
      };

      ws.onerror = () => {
        if (!joined) {
          handleJoinFailure('Verbindung fehlgeschlagen.');
        }
      };

      ws.onclose = () => {
        stopInputLoop();
        if (!joined) {
          handleJoinFailure('Verbindung getrennt.');
        }
      };
    }

    connectAndJoin();

    const gameStartFlash = document.getElementById('game-start-flash');
    let gameStartFlashTimeout = null;

    function showGameStartFlash() {
      gameStartFlash.hidden = false;
      gameStartFlash.classList.add('visible');
      if (gameStartFlashTimeout !== null) {
        clearTimeout(gameStartFlashTimeout);
      }
      gameStartFlashTimeout = setTimeout(() => {
        gameStartFlash.classList.remove('visible');
        gameStartFlash.hidden = true;
        gameStartFlashTimeout = null;
      }, 1200);
    }

    function isIos() {
      return /iPhone|iPad|iPod/i.test(navigator.userAgent);
    }

    async function lockScreenOrientation() {
      if (isIos()) return false;

      const orientation = screen.orientation;
      if (!orientation?.lock) return false;

      try {
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          try {
            await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
          } catch {
            // Fullscreen optional – lock may still work
          }
        }

        const type = orientation.type?.startsWith('landscape')
          ? orientation.type
          : 'landscape';
        await orientation.lock(type);
        return true;
      } catch (err) {
        console.warn('Orientation lock failed:', err);
        return false;
      }
    }

    function updateIosRotateHint() {
      if (!isIos()) {
        rotateHint.hidden = true;
        return;
      }
      rotateHint.innerHTML = 'Tipp: Aktiviere die <strong>Rotationssperre</strong> in der Kontrollzentrale (Schloss-Symbol), damit sich der Bildschirm beim Lenken nicht dreht.';
      rotateHint.hidden = false;
    }

    function pauseControlsForPortrait() {
      rotateScreen.hidden = false;
      brakeBtn.hidden = true;
      gasBtn.hidden = true;
      state.steering = 0;
      state.gas = false;
      state.brake = false;
      brakeBtn.classList.remove('active');
      gasBtn.classList.remove('active');
      neutralBeta = null;
    }

    function resumeControlsInLandscape() {
      rotateScreen.hidden = true;
      rotateError.hidden = true;
      rotateHint.hidden = true;
      brakeBtn.hidden = false;
      gasBtn.hidden = false;
      neutralBeta = null;
    }

    function isLandscape() {
      return window.matchMedia('(orientation: landscape)').matches
        || screen.orientation?.type?.startsWith('landscape');
    }

    const MAX_TILT = 45;
    let controlsInitialized = false;
    let steeringStarted = false;
    let neutralBeta = null;
    let landscapeWatchStarted = false;

    const rotateScreen = document.getElementById('rotate-screen');
    const rotateTitle = document.getElementById('rotate-title');
    const rotateHint = document.getElementById('rotate-hint');
    const rotateError = document.getElementById('rotate-error');
    const rotateStartBtn = document.getElementById('rotate-start-btn');
    const brakeBtn = document.getElementById('brake');
    const gasBtn = document.getElementById('gas');

    function normalizeBeta(beta) {
      if (beta == null || neutralBeta == null) return 0;
      const tilt = beta - neutralBeta;
      return Math.max(-1, Math.min(1, tilt / MAX_TILT));
    }

    function handleOrientation(event) {
      if (neutralBeta === null && event.beta != null) {
        neutralBeta = event.beta;
      }
      state.steering = normalizeBeta(event.beta);
    }

    async function startSteering() {
      if (steeringStarted) return;

      try {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission !== 'granted') {
            rotateError.textContent = 'Berechtigung verweigert – bitte erneut tippen';
            rotateError.hidden = false;
            return;
          }
        }

        steeringStarted = true;
        await lockScreenOrientation();
        neutralBeta = null;
        window.addEventListener('deviceorientation', handleOrientation, true);
        rotateScreen.hidden = true;
        rotateHint.hidden = true;
        rotateError.hidden = true;
        brakeBtn.hidden = false;
        gasBtn.hidden = false;
      } catch {
        steeringStarted = false;
        rotateError.textContent = 'Fehler – bitte erneut tippen';
        rotateError.hidden = false;
      }
    }

    function onLandscapeCheck() {
      if (!isLandscape()) {
        rotateTitle.textContent = steeringStarted
          ? 'Bitte zurück ins Querformat drehen'
          : 'Bitte Handy ins Querformat drehen';
        rotateStartBtn.hidden = true;
        rotateError.hidden = true;
        updateIosRotateHint();

        if (steeringStarted) {
          pauseControlsForPortrait();
        }
        return;
      }

      rotateError.hidden = true;

      if (steeringStarted) {
        resumeControlsInLandscape();
        return;
      }

      rotateHint.hidden = true;

      if (isIos()) {
        rotateTitle.textContent = 'Querformat erkannt';
        rotateStartBtn.hidden = false;
        updateIosRotateHint();
      } else {
        rotateTitle.textContent = 'Steuerung wird gestartet…';
        rotateStartBtn.hidden = true;
        rotateHint.hidden = true;
        startSteering();
      }
    }

    function startLandscapeWatch() {
      if (landscapeWatchStarted) {
        onLandscapeCheck();
        return;
      }
      landscapeWatchStarted = true;

      rotateScreen.hidden = false;
      rotateStartBtn.addEventListener('click', startSteering);
      window.addEventListener('orientationchange', onLandscapeCheck);
      window.addEventListener('resize', onLandscapeCheck);
      onLandscapeCheck();
    }

    function initControls() {
      if (controlsInitialized) return;
      controlsInitialized = true;

      function bindControl(button, key) {
        function press(e) {
          e.preventDefault();
          state[key] = true;
          button.classList.add('active');
        }

        function release() {
          state[key] = false;
          button.classList.remove('active');
        }

        button.addEventListener('touchstart', press, { passive: false });
        button.addEventListener('touchend', release);
        button.addEventListener('touchcancel', release);

        button.addEventListener('pointerdown', press);
        button.addEventListener('pointerup', release);
        button.addEventListener('pointercancel', release);
        button.addEventListener('pointerleave', release);
      }

      bindControl(brakeBtn, 'brake');
      bindControl(gasBtn, 'gas');
    }
  </script>
</body>
</html>
