<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Duck Drift</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #1a1a2e;
      color: #fff;
      font-family: system-ui, sans-serif;
    }

    #start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 24px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    #start-screen h1 {
      margin: 0 0 32px;
      font-size: 1.75rem;
    }

    .start-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      width: 100%;
      max-width: 720px;
    }

    @media (min-width: 640px) {
      .start-content {
        flex-direction: row;
        align-items: flex-start;
        justify-content: center;
      }
    }

    #join-form {
      width: 100%;
      max-width: 320px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #join-form label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    #join-form input {
      padding: 14px 16px;
      border: none;
      border-radius: 8px;
      font-size: 1.25rem;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      touch-action: manipulation;
    }

    #join-form input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    #room-code {
      text-align: center;
      letter-spacing: 0.3em;
      font-variant-numeric: tabular-nums;
    }

    #join-btn {
      margin-top: 8px;
      padding: 16px;
      border: none;
      border-radius: 8px;
      background: #3498db;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      touch-action: manipulation;
      cursor: pointer;
    }

    #join-btn:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #create-btn {
      padding: 16px;
      border: 2px solid #3498db;
      border-radius: 8px;
      background: transparent;
      color: #3498db;
      font-size: 1.1rem;
      font-weight: bold;
      touch-action: manipulation;
      cursor: pointer;
    }

    #join-error {
      min-height: 1.25rem;
      color: #e74c3c;
      font-size: 0.9rem;
      text-align: center;
    }

    #highscores-section {
      width: 100%;
      max-width: 320px;
      flex: 1;
    }

    #highscores-title {
      margin: 0 0 12px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
    }

    #highscores-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    #highscores-table th,
    #highscores-table td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    #highscores-table th {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
    }

    #highscores-table td:first-child,
    #highscores-table th:first-child {
      width: 2rem;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    #highscores-table td:last-child,
    #highscores-table th:last-child {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    #highscores-table tbody tr.top-3 td:first-child {
      color: #f1c40f;
      font-weight: 700;
    }

    #highscores-table .status-row td {
      text-align: center;
      color: rgba(255, 255, 255, 0.55);
      border-bottom: none;
    }
  </style>
</head>
<body>
  <div id="start-screen">
    <h1>Duck Drift</h1>
    <div class="start-content">
      <form id="join-form">
        <label>
          Lobby-Code
          <input id="room-code" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="1234" autocomplete="off" required>
        </label>
        <label>
          Name
          <input id="player-name" type="text" maxlength="20" placeholder="Dein Name" autocomplete="nickname" required>
        </label>
        <p id="join-error" aria-live="polite"></p>
        <button type="submit" id="join-btn">Beitreten</button>
        <button type="button" id="create-btn">Lobby erstellen</button>
      </form>
      <section id="highscores-section" aria-labelledby="highscores-title">
        <h2 id="highscores-title">Most Wins</h2>
        <table id="highscores-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Player</th>
              <th>Wins</th>
            </tr>
          </thead>
          <tbody id="highscores-body"></tbody>
        </table>
      </section>
    </div>
  </div>

  <script>
    const joinForm = document.getElementById('join-form');
    const roomCodeInput = document.getElementById('room-code');
    const playerNameInput = document.getElementById('player-name');
    const joinError = document.getElementById('join-error');
    const createBtn = document.getElementById('create-btn');
    const highscoresBody = document.getElementById('highscores-body');

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function loadHighscores() {
      highscoresBody.innerHTML = '<tr class="status-row"><td colspan="3">Laden…</td></tr>';

      try {
        const res = await fetch('/api/highscores');
        if (!res.ok) {
          throw new Error(res.status);
        }

        const scores = await res.json();

        if (!scores.length) {
          highscoresBody.innerHTML = '<tr class="status-row"><td colspan="3">Noch keine Siege.</td></tr>';
          return;
        }

        highscoresBody.innerHTML = scores.map((entry, i) => {
          const rank = i + 1;
          const rowClass = rank <= 3 ? ' class="top-3"' : '';
          return `<tr${rowClass}><td>${rank}</td><td>${escapeHtml(entry.playerName)}</td><td>${entry.wins}</td></tr>`;
        }).join('');
      } catch {
        highscoresBody.innerHTML = '<tr class="status-row"><td colspan="3">Highscores nicht verfügbar.</td></tr>';
      }
    }

    const params = new URLSearchParams(location.search);
    const roomFromUrl = params.get('room');
    const errorFromUrl = params.get('error');

    if (roomFromUrl && /^\d{4}$/.test(roomFromUrl)) {
      roomCodeInput.value = roomFromUrl;
    }

    if (errorFromUrl) {
      joinError.textContent = errorFromUrl;
    }

    joinForm.addEventListener('submit', (e) => {
      e.preventDefault();
      joinError.textContent = '';

      const roomCode = roomCodeInput.value.trim();
      const name = playerNameInput.value.trim();

      if (!/^\d{4}$/.test(roomCode)) {
        joinError.textContent = 'Lobby-Code muss 4 Ziffern haben.';
        return;
      }
      if (!name) {
        joinError.textContent = 'Bitte einen Namen eingeben.';
        return;
      }

      const url = new URL('/controller/', location.origin);
      url.searchParams.set('room', roomCode);
      url.searchParams.set('name', name);
      location.href = url.toString();
    });

    createBtn.addEventListener('click', () => {
      location.href = '/host/';
    });

    loadHighscores();
  </script>
</body>
</html>
