<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duck Drift</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #room-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      padding: 1.5rem 1rem;
      background: rgba(0, 0, 0, 0.55);
    }
    .room-label {
      margin: 0 0 0.25rem;
      font-family: system-ui, sans-serif;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.75);
    }
    .room-code {
      margin: 0;
      font-family: ui-monospace, 'Cascadia Code', monospace;
      font-size: clamp(4rem, 12vw, 10rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.2em;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="room-overlay">
    <p class="room-label">Raumcode</p>
    <p id="room-code" class="room-code">----</p>
  </div>
  <canvas id="game"></canvas>
  <script type="module" src="js/main.js"></script>
</body>
</html>
